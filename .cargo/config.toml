[build]

[target.x86_64-unknown-none]
rustflags = [
    "-C",
    "force-frame-pointers",
    "--cfg",
    "aes_force_soft",
    "--cfg",
    'aes_backend="soft"',
    "--cfg",
    "polyval_force_soft",
    # getrandom 0.3 has no backend for bare-metal targets; the SVSM kernel
    # provides one (see `kernel/src/vtpm/tpmrs/getrandom.rs`).
    "--cfg",
    'getrandom_backend="custom"',
]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "code-model=kernel"]

[alias]
verify = "verus focus --features verus"
xbuild = "run --package xbuild --release --"
